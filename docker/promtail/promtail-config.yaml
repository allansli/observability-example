server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: container_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/log/containers/*log

  - job_name: application_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: application
          service: api-service
          __path__: /app/logs/api-service.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            trace_id: traceId
            span_id: spanId
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          trace_id:
          span_id:
          level:
          service:

  - job_name: subscriber_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: application
          service: subscriber-service
          __path__: /app/logs/subscriber-service.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            trace_id: traceId
            span_id: spanId
            service: service
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          trace_id:
          span_id:
          level:
          service: