global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889']

  - job_name: 'api-service'
    static_configs:
      - targets: ['172.17.0.1:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'subscriber-service'
    static_configs:
      - targets: ['172.17.0.1:8081']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
    metrics_path: '/metrics'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3001']
    metrics_path: '/metrics'