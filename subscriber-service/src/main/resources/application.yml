# Subscriber Service Configuration
# Comprehensive observability configuration for async message processing

# ======================================
# Server Configuration
# ======================================
server:
  port: 8081
  servlet:
    context-path: /

# ======================================  
# Spring Configuration
# ======================================
spring:
  application:
    name: subscriber-service
  
  profiles:
    active: local
  
  # ======================================
  # Database Configuration (PostgreSQL)
  # ======================================
  datasource:
    url: jdbc:postgresql://localhost:5432/observability
    username: obs_user
    password: obs_password
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SubscriberServicePool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
      auto-commit: false
      
  # ======================================
  # JPA Configuration
  # ======================================
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        connection:
          provider_disables_autocommit: true
        
  # ======================================
  # GCP Pub/Sub Configuration
  # ======================================
  cloud:
    gcp:
      project-id: observability-project
      pubsub:
        enabled: true
        emulator-host: localhost:8085
        subscriber:
          parallel-pull-count: 4
          max-ack-extension-period: 600000
          flow-control:
            max-outstanding-element-count: 1000
            max-outstanding-request-bytes: 104857600

# ======================================
# Logging Configuration
# ======================================
logging:
  level:
    com.example.observability: INFO
    com.google.cloud: WARN
    org.springframework.cloud.gcp: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  file:
    name: logs/subscriber-service.log
    max-size: 100MB
    max-history: 30

# ======================================
# Actuator Configuration
# ======================================
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops,beans,threaddump,heapdump,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      service: subscriber-service
      environment: local
    export:
      prometheus:
        enabled: true
        step: 10s
        descriptions: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        pubsub.message.processing.duration: true
        orders.processing.duration: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s
        pubsub.message.processing.duration: 100ms,500ms,1s,2s,5s
        orders.processing.duration: 100ms,500ms,1s,2s

# ======================================
# OpenTelemetry Configuration
# ======================================
otel:
  service:
    name: subscriber-service
    version: 1.0.0-SNAPSHOT
  resource:
    attributes:
      service.name: subscriber-service
      service.version: 1.0.0-SNAPSHOT
      service.instance.id: subscriber-service-${random.uuid}
      deployment.environment: local
  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf
      timeout: 10s
      compression: gzip
      headers:
        service-name: subscriber-service
  traces:
    exporter: otlp
    sampler: always_on
  metrics:
    exporter: prometheus
  logs:
    exporter: otlp

# ======================================
# Micrometer Tracing Configuration  
# ======================================
micrometer:
  observation:
    annotations:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    baggage:
      enabled: true
      remote-fields:
        - x-trace-id
        - x-span-id
        - x-customer-id
        - x-order-id
    export:
      timeout: 10s
    propagation:
      type: w3c,b3

# ======================================
# Thread Configuration (Virtual Threads)
# ======================================  
spring.threads.virtual.enabled: true

# ======================================
# Application Specific Configuration
# ======================================
app:
  subscriber:
    subscription-name: orders-subscription
    max-concurrent-messages: 10
    ack-deadline: 60s
    processing:
      timeout: 30s
      retry-attempts: 3
      retry-delay: 1s
  
  database:
    connection-pool:
      max-size: 20
      min-idle: 5
      validation-timeout: 5s
      
  observability:
    metrics:
      enabled: true
      custom-tags:
        team: platform
        domain: orders
    tracing:
      enabled: true
      sample-rate: 1.0
    logging:
      structured: true
      correlation-id: true